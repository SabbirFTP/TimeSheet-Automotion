<!DOCTYPE html>
<html>
<head>
  <title>Form Automator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Form Automator</h1>
      <div class="theme-toggle">
        <button class="theme-btn" id="theme-light" title="Light Mode">
          <svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37a.996.996 0 00-1.41-1.41l-1.06 1.06a.996.996 0 000 1.41c.39.39 1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 00-1.41-1.41l-1.06 1.06a.996.996 0 000 1.41c.39.39 1.03.39 1.41 0l1.06-1.06z"/></svg>
        </button>
        <button class="theme-btn" id="theme-dark" title="Dark Mode">
          <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
        </button>
        <button class="theme-btn" id="theme-system" title="System Theme">
          <svg viewBox="0 0 24 24"><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
        </button>
      </div>
    </div>
    
    <div class="stats-grid" id="statsGrid" style="display: none;">
      <div class="stat-card">
        <span class="stat-label">Total</span>
        <span class="stat-value" id="totalTasks">0</span>
      </div>
      <div class="stat-card highlight">
        <span class="stat-label">Left</span>
        <span class="stat-value" id="leftTasks">0</span>
      </div>
      <div class="stat-card success">
        <span class="stat-label">Done</span>
        <span class="stat-value" id="doneTasks">0</span>
      </div>
    </div>

    <div class="input-group">
      <label for="submitDate">Submission Date (Optional)</label>
      <input type="date" id="submitDate">
      <small>Defaults to current date if empty</small>
    </div>

    <div class="input-group">
      <label for="jsonInput">JSON Tasks Array</label>
      <textarea id="jsonInput" placeholder='[{"project": "...", "description": "...", "start_time": "...", "end_time": "..."}]'></textarea>
    </div>

    <button id="startButton">Start Automation</button>
    <button id="resetButton" class="outline">Reset Progress</button>
    <div id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
